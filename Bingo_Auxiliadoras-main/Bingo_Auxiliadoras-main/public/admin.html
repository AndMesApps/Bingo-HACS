<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administración del bingo</title>
<link rel="icon" href="img/logo-hacs.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero compacto">
  <div class="hero-in ancho">
    <div class="hero-barra">
      <div class="marca">
        <img class="logo" src="img/logo-hacs.jpg" alt="HACS">
        <div>
          <p class="kicker">Hermanas Auxiliadoras de Cristo Sacerdote</p>
          <h1 id="titulo">Administración del bingo</h1>
        </div>
      </div>
      <button class="ghost" id="salir" type="button" hidden>Salir</button>
    </div>
  </div>
</header>
<main class="wrap ancho sube">
  <section id="login" class="card" hidden style="max-width:400px;margin:24px auto">
    <h2 style="margin-top:0">Ingreso de administración</h2>
    <form id="form-login">
      <label>Contraseña <input type="password" name="clave" required autofocus></label>
      <div class="actions"><button type="submit" class="grande">Entrar</button></div>
      <p class="msg bad" id="login-msg"></p>
    </form>
  </section>

  <section id="panel" hidden>
    <nav class="tabs" id="tabs"></nav>
    <p class="msg" id="msg" role="status"></p>
    <div id="vista"></div>
  </section>
</main>
<script src="admin.js"></script>
<script src="ayuda.js" data-destino="manual.html#parte-b" data-sugeridos="b5,b6,b7,b3,b15,b16"></script>
</body>
</html>
