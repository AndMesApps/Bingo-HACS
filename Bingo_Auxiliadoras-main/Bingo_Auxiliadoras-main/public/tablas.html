<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mis tablas del bingo</title>
<link rel="icon" href="img/logo-hacs.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero compacto">
  <div class="hero-in">
    <img class="logo" src="img/logo-hacs.jpg" alt="Hermanas Auxiliadoras de Cristo Sacerdote">
    <h1 id="titulo">Mis tablas del bingo</h1>
  </div>
</header>
<main class="wrap sube">
  <section class="card" id="cabecera" hidden>
    <p style="margin:0">Hola <strong id="nombre"></strong>, estas son tus <strong id="cuantas"></strong>. ¡Mucha suerte!</p>
    <p class="muted" style="margin:8px 0 0">Cada tabla lleva tu nombre y teléfono: solo es válida para ti y no se puede transferir.</p>
    <div class="actions no-print" id="acciones"></div>
    <p class="muted no-print" id="ayuda-pdf" style="margin:10px 0 0" hidden>El PDF trae 4 tablas por hoja tamaño carta, con líneas punteadas para recortarlas. <a href="manual.html#a8" target="_blank" rel="noopener">¿Cómo las imprimo?</a></p>
  </section>
  <div class="tablas-grid" id="lista"></div>
  <p class="msg bad" id="error"></p>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
(async () => {
  const token = new URLSearchParams(location.search).get('t') || '';
  try {
    const res = await fetch(`/api/publico/entrega/${encodeURIComponent(token)}`);
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'Enlace no válido.');
    if (d.evento) $('titulo').textContent = d.evento;
    $('nombre').textContent = d.nombre;
    $('cuantas').textContent = d.tablas.length === 1 ? 'tabla' : `${d.tablas.length} tablas`;
    $('cabecera').hidden = false;
    // PDF para imprimir: 4 tablas por hoja carta, hasta 20 tablas por archivo.
    const POR_PDF = 20;
    const acciones = [];
    if (d.imagenes) {
      const partes = Math.ceil(d.tablas.length / POR_PDF);
      for (let p = 1; p <= partes; p++) {
        const lote = d.tablas.slice((p - 1) * POR_PDF, p * POR_PDF);
        const texto = partes === 1 ? 'Descargar PDF para imprimir' : `PDF ${p} · tablas ${lote[0]} a ${lote[lote.length - 1]}`;
        acciones.push(`<a class="btn" href="/api/publico/entrega/${encodeURIComponent(token)}/pdf?parte=${p}" download>${esc(texto)}</a>`);
      }
      $('ayuda-pdf').hidden = false;
    }
    acciones.push('<button type="button" class="ghost" onclick="window.print()">Imprimir esta página</button>');
    $('acciones').innerHTML = acciones.join('');
    $('lista').innerHTML = d.tablas.map(s => {
      const url = `/api/publico/entrega/${token}/imagen/${encodeURIComponent(s)}`;
      return d.imagenes
        ? `<figure class="tabla-item card" style="margin:0"><a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="Tabla ${esc(s)}" loading="lazy"></a>
             <figcaption><strong>Tabla N° ${esc(s)}</strong><br><a class="btn ghost no-print" href="${url}" download="Tabla-${esc(s)}.jpg">Descargar</a></figcaption></figure>`
        : `<div class="card"><strong>Tabla N° ${esc(s)}</strong></div>`;
    }).join('');
    if (!d.imagenes) $('error').textContent = 'Estos son los números de tus tablas. La organización te hará llegar las imágenes.';
  } catch (err) {
    $('error').textContent = err.message;
  }
})();
</script>
</body>
</html>
